    function useFadeUp() {
      const ref = useRef(null);
      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        el.classList.add('fade-up');
        const obs = new IntersectionObserver(
          ([entry]) => { if (entry.isIntersecting) { el.classList.add('visible'); obs.disconnect(); } },
          { threshold: 0.1 }
        );
        obs.observe(el);
        return () => obs.disconnect();
      }, []);
      return ref;
    }

    /* ─── Typewriter ────────────────────────────────────────────────────── */

    function Typewriter({ texts, speed = 75, pause = 1800 }) {
      const [idx, setIdx] = useState(0);
      const [char, setChar] = useState(0);
      const [del, setDel] = useState(false);

      useEffect(() => {
        const cur = texts[idx];
        let t;
        if (!del && char < cur.length) {
          t = setTimeout(() => setChar(c => c + 1), speed);
        } else if (!del && char === cur.length) {
          t = setTimeout(() => setDel(true), pause);
        } else if (del && char > 0) {
          t = setTimeout(() => setChar(c => c - 1), speed / 2);
        } else {
          setDel(false);
          setIdx(i => (i + 1) % texts.length);
        }
        return () => clearTimeout(t);
      }, [char, del, idx, texts, speed, pause]);

      return (
        <span>
          {texts[idx].slice(0, char)}
          <span className="cursor-blink text-indigo-400">|</span>
        </span>
      );
    }

                        </div>
                      </div>

                      <div className={`overflow-hidden transition-all duration-300 ${expanded === idx ? 'max-h-96 mb-4' : 'max-h-0'}`}>
                        <ul className="space-y-2 mt-1">
                          {exp.highlights.map((h, i) => (
                            <li key={i} className={`flex gap-3 text-sm leading-relaxed ${dark ? 'text-zinc-400' : 'text-gray-600'}`}>
                              <span className="text-indigo-400 shrink-0 mt-0.5">→</span>
                              {h}
                            </li>
                          ))}
                        </ul>
                      </div>

                      <div className="flex flex-wrap gap-2">
                        {exp.tags.map(t => (
                          <span key={t}
                            className={`px-2.5 py-1 text-xs rounded-lg border ${
                              dark ? 'bg-zinc-800 text-zinc-300 border-zinc-700' : 'bg-gray-100 text-gray-600 border-gray-200'
                            }`}>
                            {t}
                          </span>
                        ))}
                      </div>

                      <div className={`mt-3 text-xs ${dark ? 'text-zinc-600' : 'text-gray-400'}`}>
                        {expanded === idx ? '▲ Collapse' : '▼ Show details'}
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </section>
      );
    }

    /* ─── Skills ────────────────────────────────────────────────────────── */

    function Skills({ dark }) {
      const ref = useFadeUp();
      return (
        <section id="skills" className={`py-24 ${dark ? 'bg-zinc-900/40' : 'bg-white'}`}>
          <div className="max-w-6xl mx-auto px-6">
            <div ref={ref}>
              <span className="text-indigo-400 text-sm font-semibold uppercase tracking-widest">Toolkit</span>
              <h2 className={`text-4xl font-black mt-2 mb-12 ${dark ? 'text-white' : 'text-gray-900'}`}>Skills</h2>
            </div>

            <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-5">
              {Object.entries(SKILLS).map(([cat, items]) => (
                <div key={cat}
                  className={`rounded-2xl p-6 border card-hover ${dark ? 'bg-zinc-900 border-zinc-800' : 'bg-white border-gray-200 shadow-sm'}`}>
                  <h3 className="text-indigo-400 font-semibold text-xs uppercase tracking-widest mb-4">{cat}</h3>
                  <div className="flex flex-wrap gap-2">
                    {items.map(s => (
                      <span key={s}
                        className={`px-3 py-1.5 text-sm rounded-lg border transition-colors cursor-default ${
                          dark ? 'bg-zinc-800 hover:bg-zinc-700 text-zinc-300 border-zinc-700' : 'bg-gray-100 hover:bg-gray-200 text-gray-700 border-gray-200'
                        }`}>
                        {s}
                      </span>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    }

    /* ─── Projects ──────────────────────────────────────────────────────── */

    function Projects({ dark }) {
      const ref = useFadeUp();
      return (
        <section id="projects" className={`py-24 ${dark ? 'bg-zinc-950' : 'bg-slate-50'}`}>
          <div className="max-w-6xl mx-auto px-6">
            <div ref={ref}>
              <span className="text-indigo-400 text-sm font-semibold uppercase tracking-widest">Work</span>
              <h2 className={`text-4xl font-black mt-2 mb-3 ${dark ? 'text-white' : 'text-gray-900'}`}>Projects</h2>
              <p className={`mb-12 ${dark ? 'text-zinc-400' : 'text-gray-500'}`}>Key systems and applications I've built</p>
            </div>

            <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-5">
              {PROJECTS.map((p, idx) => (
                <div key={idx}
                  className={`rounded-2xl p-6 border card-hover group ${
                    dark ? 'bg-zinc-900 border-zinc-800 hover:border-zinc-600' : 'bg-white border-gray-200 hover:border-indigo-200 shadow-sm'
                  }`}>
                  <div className="text-3xl mb-4">{p.icon}</div>
                  <h3 className={`font-bold text-base mb-2 group-hover:text-indigo-400 transition-colors ${dark ? 'text-white' : 'text-gray-900'}`}>
                    {p.title}
                  </h3>
                  <p className={`text-sm leading-relaxed mb-4 ${dark ? 'text-zinc-400' : 'text-gray-500'}`}>{p.desc}</p>
                  <div className="flex flex-wrap gap-2">
                    {p.tags.map(t => (
                      <span key={t} className="px-2 py-1 bg-indigo-500/10 text-indigo-400 text-xs rounded-md border border-indigo-500/20">
                        {t}
                      </span>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    }

    /* ─── GitHub ────────────────────────────────────────────────────────── */

    function GitHub({ dark }) {
      const [repos, setRepos] = useState([]);
      const ref = useFadeUp();

      useEffect(() => {
        fetch('https://api.github.com/users/gtejas1/repos?sort=updated&per_page=6')
          .then(r => r.json())
          .then(d => Array.isArray(d) && setRepos(d.slice(0, 6)))
          .catch(() => {});
      }, []);

      if (!repos.length) return null;

      return (
        <section className={`py-20 ${dark ? 'bg-zinc-900/40' : 'bg-white'}`}>
          <div className="max-w-6xl mx-auto px-6">
            <div ref={ref}>
              <span className="text-indigo-400 text-sm font-semibold uppercase tracking-widest">Open Source</span>
              <h2 className={`text-3xl font-black mt-2 mb-10 ${dark ? 'text-white' : 'text-gray-900'}`}>
                Recent GitHub Repos
              </h2>
            </div>
            <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
              {repos.map(r => (
                <a key={r.id} href={r.html_url} target="_blank" rel="noopener noreferrer"
                  className={`rounded-2xl p-5 border card-hover block group ${
                    dark ? 'bg-zinc-900 border-zinc-800 hover:border-zinc-600' : 'bg-gray-50 border-gray-200 hover:border-indigo-200'
                  }`}>
                  <div className="flex items-start justify-between gap-2 mb-2">
                    <h3 className={`font-semibold text-sm group-hover:text-indigo-400 transition-colors truncate ${dark ? 'text-white' : 'text-gray-900'}`}>
                      {r.name}
                    </h3>
                    <span className={`text-xs shrink-0 ${dark ? 'text-zinc-600' : 'text-gray-400'}`}>↗</span>
                  </div>
                  {r.description && (
                    <p className={`text-xs leading-relaxed mb-3 line-clamp-2 ${dark ? 'text-zinc-400' : 'text-gray-500'}`}>{r.description}</p>
                  )}
                  {r.language && (
                    <span className={`text-xs px-2 py-1 rounded-md ${dark ? 'bg-zinc-800 text-zinc-400 border border-zinc-700' : 'bg-gray-200 text-gray-600'}`}>
                      {r.language}
                    </span>
                  )}
                </a>
              ))}
            </div>
          </div>
        </section>
      );
    }

    /* ─── Contact ───────────────────────────────────────────────────────── */

    function Contact({ dark }) {
      const ref = useFadeUp();
      return (
        <section id="contact" className={`py-24 ${dark ? 'bg-zinc-950' : 'bg-slate-50'}`}>
          <div className="max-w-6xl mx-auto px-6">
            <div ref={ref} className="max-w-2xl mx-auto text-center">
              <span className="text-indigo-400 text-sm font-semibold uppercase tracking-widest">Say hello</span>
              <h2 className={`text-4xl md:text-5xl font-black mt-2 mb-4 ${dark ? 'text-white' : 'text-gray-900'}`}>
                Let's work together
              </h2>
              <p className={`text-lg mb-3 ${dark ? 'text-zinc-400' : 'text-gray-500'}`}>
                Actively seeking Software Engineering / AI / ML roles.
              </p>
              <p className="text-indigo-400 text-sm font-medium mb-12">
                OPT authorized · STEM-OPT eligible · No immediate visa sponsorship required
              </p>

              <div className="flex flex-col sm:flex-row justify-center gap-4">
                <a href="mailto:tejas.guduru@gmail.com"
                  className="flex items-center justify-center gap-2 px-6 py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl transition-all hover:-translate-y-0.5 shadow-lg shadow-indigo-500/25">
                  📧 tejas.guduru@gmail.com
                </a>
                <a href="https://www.linkedin.com/in/tejasguduru" target="_blank" rel="noopener noreferrer"
                  className={`flex items-center justify-center gap-2 px-6 py-3.5 font-semibold rounded-xl border transition-all hover:-translate-y-0.5 ${
                    dark ? 'bg-zinc-800 hover:bg-zinc-700 text-white border-zinc-700' : 'bg-white hover:bg-gray-50 text-gray-800 border-gray-200 shadow-sm'
                  }`}>
                  LinkedIn Profile
                </a>
                <a href="tel:+14145540441"
                  className={`flex items-center justify-center gap-2 px-6 py-3.5 font-semibold rounded-xl border transition-all hover:-translate-y-0.5 ${
                    dark ? 'bg-zinc-800 hover:bg-zinc-700 text-white border-zinc-700' : 'bg-white hover:bg-gray-50 text-gray-800 border-gray-200 shadow-sm'
                  }`}>
                  📞 (414) 554-0441
                </a>
              </div>
            </div>
          </div>
        </section>
      );
    }

    /* ─── Footer ────────────────────────────────────────────────────────── */

    function Footer({ dark }) {
      return (
        <footer className={`border-t py-8 ${dark ? 'bg-zinc-900 border-zinc-800' : 'bg-white border-gray-200'}`}>
          <div className="max-w-6xl mx-auto px-6 flex flex-col md:flex-row items-center justify-between gap-4">
            <p className={`text-sm ${dark ? 'text-zinc-500' : 'text-gray-400'}`}>
              © 2025 Tejas Guduru · Built with React &amp; Tailwind
            </p>
            <div className="flex items-center gap-6">
              {[
                { label: "LinkedIn", href: "https://www.linkedin.com/in/tejasguduru" },
                { label: "GitHub",   href: "https://github.com/gtejas1" },
                { label: "Email",    href: "mailto:tejas.guduru@gmail.com" },
              ].map(l => (
                <a key={l.label} href={l.href}
                  target={l.href.startsWith('http') ? '_blank' : undefined}
                  rel="noopener noreferrer"
                  className={`text-sm transition-colors ${dark ? 'text-zinc-500 hover:text-white' : 'text-gray-400 hover:text-gray-900'}`}>
                  {l.label}
                </a>
              ))}
            </div>
          </div>
        </footer>
      );
    }

    /* ─── App ───────────────────────────────────────────────────────────── */

    function App() {
      const [dark, setDark] = useState(true);

      useEffect(() => {
        document.documentElement.classList.toggle('dark', dark);
        document.body.style.backgroundColor = dark ? '#09090b' : '#f8fafc';
      }, [dark]);

      return (
        <>
          <Nav dark={dark} toggleDark={() => setDark(d => !d)} />
          <main>
            <Hero dark={dark} />
            <About dark={dark} />
            <Experience dark={dark} />
            <Skills dark={dark} />
            <Projects dark={dark} />
            <GitHub dark={dark} />
            <Contact dark={dark} />
          </main>
          <Footer dark={dark} />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
